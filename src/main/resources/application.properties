spring.application.name=smart-order
spring.datasource.url=jdbc:postgresql://localhost:5432/smartorder
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


logging.level.org.springframework.security=DEBUG

# JWT properties
app.jwt.secret=this_is_a_very_secret_key_change_it
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

server.port=8080

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# To allow JSON DTOs from any package
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.group-id=smartorder_group

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


app.kafka.topic.order-created=order_created_topic

spring.data.redis.host=localhost
spring.data.redis.port=6379


